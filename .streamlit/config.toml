[server]
enableStaticServing = true

[theme]
# Clinical light theme (healthcare-inspired, from jmedia65/awesome-streamlit-themes)
base = "light"
primaryColor = "#0066cc"             # medical blue — trust, reliability
backgroundColor = "#fafbfc"          # off-white — clinical clean
secondaryBackgroundColor = "#f4f6f8" # light gray-blue — subtle
textColor = "#2c3e50"                # dark blue-gray — readable, professional
linkColor = "#0052a3"               # darker medical blue for links
borderColor = "#dee2e6"              # soft clinical border
showWidgetBorder = true
baseRadius = "0.375rem"             # minimal rounding — precise, professional
font = "IBM Plex Sans"
headingFont = "IBM Plex Sans"
codeFont = "IBM Plex Mono"

# Self-hosted fonts (static/fonts/*.woff2) — no external font CDN, no Google
# Fonts request. Served via server.enableStaticServing above; the URL prefix
# is "app/static/..." per Streamlit 1.62's _ROUTE_APP_STATIC.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-600-normal.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-700-normal.woff2"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
weight = "400"
style = "normal"
